[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adforge-renderer"
version = "0.1.0"
description = "Deterministic local renderer for AdForge AI milestone 1"
requires-python = ">=3.11,<3.12"
dependencies = [
  "Pillow==11.1.0",
  "pydantic==2.10.6",
  "httpx==0.28.1",
  "beautifulsoup4==4.13.3",
  "fastapi==0.115.12",
  "uvicorn==0.34.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
adforge-render = "adforge_renderer.cli:main"
adforge-scan = "adforge_renderer.scan_cli:main"
adforge-api = "adforge_renderer.api:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
